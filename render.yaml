services:
  - type: web
    name: cupholder
    runtime: python
    plan: free
    branch: claude-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        sync: false
      - key: USA_JOBS_API_KEY
        sync: false
      - key: USER_AGENT
        sync: false
