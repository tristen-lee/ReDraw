services:
  - type: web
    name: cupholder
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        sync: false
      - key: USA_JOBS_API_KEY
        sync: false
      - key: USER_AGENT
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SITE_BASE_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: PMTILES_URL
        sync: false
