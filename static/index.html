<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupholder</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1 class="wordmark"><img src="/cupholder.svg" alt="Cupholder"></h1>
    <p class="tagline">Draw the drive you'd actually make. See the jobs inside it.</p>
</header>

<div class="controls">
    <button id="draw-button" class="primary">Draw your area</button>
    <button id="clear-button">Clear</button>
    <input type="text" id="job-input" placeholder="Keyword (optional)" autocomplete="off">
    <button id="search-button">Search</button>
    <span id="status">Draw an area to search inside it.</span>
    <a class="post-link" href="/post.html">Hiring? Post a job free →</a>
</div>

<div id="map"></div>

<footer>
    <span id="freshness"></span>
    <span>Federal listings courtesy of <a href="https://www.usajobs.gov" target="_blank" rel="noopener">USAJOBS</a>. Apply on the original posting.</span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>

</body>
</html>
