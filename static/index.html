<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupholder</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Cupholder</h1>
    <p class="tagline">Draw the drive you'd actually make. See the jobs inside it.</p>
</header>

<div class="controls">
    <input type="text" id="job-input" placeholder="Keyword (optional)" autocomplete="off">
    <button id="search-button">Search</button>
    <span id="status">Use the polygon tool to draw your commute, then search.</span>
    <a class="post-link" href="/post.html">Hiring? Post a job free →</a>
</div>

<div id="map"></div>

<footer>
    <span id="freshness"></span>
    <span>Federal listings courtesy of <a href="https://www.usajobs.gov" target="_blank" rel="noopener">USAJOBS</a>. Apply on the original posting.</span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="map.js"></script>

</body>
</html>
