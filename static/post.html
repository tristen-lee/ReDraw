<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a job | Cupholder</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">

<header>
    <h1 class="wordmark"><a href="/"><img src="/cupholder.svg" alt="Cupholder"></a></h1>
    <p class="tagline">Free for local employers. No account, no cost, no catch.</p>
</header>

<main class="form-wrap">
    <form id="post-form" novalidate>
        <label>
            Employer
            <input name="employer" required maxlength="200" placeholder="Arcadia Paper Mills">
        </label>

        <label>
            Job title
            <input name="title" required maxlength="200" placeholder="Industrial Electrician">
        </label>

        <label>
            Town
            <input name="town" required maxlength="120" placeholder="St. Helens, OR">
            <small>Town and state.</small>
        </label>

        <label>
            Street address
            <input name="street_address" required maxlength="300" placeholder="1721 Columbia Blvd">
            <small>Where the work happens. Every job here sits on its real address, so people know exactly how far the drive is.</small>
        </label>

        <label>
            Description
            <textarea name="description" required rows="8" maxlength="20000"
                      placeholder="What the job is, what it pays, what shift, what you need from an applicant."></textarea>
            <small>At least a couple of sentences.</small>
        </label>

        <label>
            Where to apply
            <input name="apply_url" required maxlength="500" placeholder="yoursite.com/jobs or hiring@yoursite.com">
            <small>A link to your application, or an email that takes résumés.</small>
        </label>

        <label>
            Your email
            <input name="contact_email" type="email" required maxlength="200" placeholder="hiring@example.com">
            <small>Not shown publicly. Used to reach you about the listing.</small>
        </label>

        <input class="trap" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit">Submit for review</button>
        <p id="form-status"></p>
    </form>
</main>

<script src="track.js"></script>
<script src="post.js"></script>

</body>
</html>
