<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic — Cupholder</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
          integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="stats-page">

<header class="stats-head">
    <a class="wordmark" href="/"><img src="/cupholder.svg" alt="Cupholder"></a>
    <nav class="stats-range" aria-label="Date range">
        <button type="button" data-days="7">7 days</button>
        <button type="button" data-days="30" aria-pressed="true">30 days</button>
        <button type="button" data-days="90">90 days</button>
    </nav>
    <a class="nav-link" href="/admin.html">Review queue</a>
</header>

<main class="stats">
    <div id="auth">
        <label>
            Admin token
            <input id="token" type="password" autocomplete="off">
        </label>
        <button id="unlock">Unlock</button>
    </div>
    <p id="stats-status" class="meta"></p>

    <div id="board" hidden>
        <section class="tiles" id="tiles"></section>

        <section class="stats-block">
            <h2>Funnel</h2>
            <p class="meta">Sessions that reached each step.</p>
            <div id="funnel" class="funnel"></div>
        </section>

        <section class="stats-block">
            <h2>Per day</h2>
            <div class="daily">
                <figure><figcaption>Visitors</figcaption><div id="daily-visitors"></div></figure>
                <figure><figcaption>Searches</figcaption><div id="daily-searches"></div></figure>
                <figure><figcaption>Apply clicks</figcaption><div id="daily-applies"></div></figure>
            </div>
        </section>

        <section class="stats-block">
            <h2>Where people want to work</h2>
            <p class="meta" id="shapes-note"></p>
            <div id="shapes-map" class="shapes-map"></div>
        </section>

        <div class="stats-grid">
            <section class="stats-block"><h2>Where they came from</h2><div id="sources"></div></section>
            <section class="stats-block"><h2>Searching</h2><div id="searching"></div><div id="keywords"></div></section>
            <section class="stats-block"><h2>Pages</h2><div id="pages"></div><div id="devices"></div></section>
            <section class="stats-block"><h2>Jobs people looked at</h2><div id="jobs"></div></section>
        </div>

        <section class="stats-block"><h2>Script errors</h2><div id="errors"></div></section>
    </div>
</main>

<div id="chart-tip" class="chart-tip" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
        integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
<script src="stats.js"></script>

</body>
</html>
