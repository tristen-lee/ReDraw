<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review queue — Cupholder</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">

<header>
    <h1 class="wordmark"><a href="/"><img src="/cupholder.svg" alt="Cupholder"></a></h1>
    <p class="tagline">Submissions waiting on review.</p>
</header>

<main class="form-wrap">
    <div id="auth">
        <label>
            Admin token
            <input id="token" type="password" autocomplete="off">
        </label>
        <button id="unlock">Unlock</button>
    </div>

    <p id="queue-status"></p>
    <div id="queue"></div>
</main>

<script src="admin.js"></script>

</body>
</html>
